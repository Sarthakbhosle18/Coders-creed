<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.min.js"></script>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        div{
            width: 300px;
            height: 100px;
            padding: 5px;
            margin: 3px;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    
    <div></div>
    <button>click me</button>

    <script>

        $(document).ready(function(){
            $('div').html($(div).width())
            $('div').html($(div).height())
            $('div').html($(div).innerWidth())
            $('div').html($(div).innerHeight())
            $('div').html($(div).outerHeight())
            $('div').html($(div).outerWidth())
            $('div').html($(div).outerWidth(true))
            $('div').html($(div).outerHeight(true))
        })

    </script>

</body>
</html>
